[project]
name = "apex-python-service"
version = "0.1.0"
description = "Python ML and processing service for Painting Made Easy Denver CRM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # AWS/Storage
    "boto3>=1.34.0",
    "aioboto3>=12.0.0",

    # Utilities
    "loguru>=0.7.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
scraping = [
    "playwright>=1.41.0",
    "playwright-stealth>=1.0.6",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.2.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
]
media = [
    "openai-whisper>=20231117",
    "pydub>=0.25.1",
    "aiortc>=1.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]
all = [
    "apex-python-service[scraping,ml,media,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
