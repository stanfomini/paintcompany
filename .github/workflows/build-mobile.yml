name: Build Mobile Apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - android
          - both
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'

jobs:
  build-ios:
    if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install NativePHP
        run: php artisan native:install --no-interaction

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build iOS app
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            php artisan native:build --release --no-interaction
          else
            php artisan native:build --no-interaction
          fi
        env:
          NATIVEPHP_APP_ID: ${{ secrets.NATIVEPHP_APP_ID }}

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ github.event.inputs.build_type }}-${{ github.sha }}
          path: |
            nativephp/ios/build/**/*.app
            nativephp/ios/build/**/*.ipa
          retention-days: 14

  build-android:
    if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install NativePHP
        run: php artisan native:install --no-interaction

      - name: Decode Android keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-keystore.jks

      - name: Build Android app (Debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          cd nativephp/android
          ./gradlew assembleDebug
        env:
          NATIVEPHP_APP_ID: ${{ secrets.NATIVEPHP_APP_ID }}

      - name: Build Android app (Release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          php artisan native:package android \
            --keystore=android-keystore.jks \
            --keystore-password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            --key-password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-interaction
        env:
          NATIVEPHP_APP_ID: ${{ secrets.NATIVEPHP_APP_ID }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-${{ github.event.inputs.build_type }}-${{ github.sha }}
          path: |
            nativephp/android/app/build/outputs/**/*.apk
            nativephp/android/app/build/outputs/**/*.aab
          retention-days: 14
